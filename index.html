<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiktok.com</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --tiktok-red: #fe2c55;
            --tiktok-bg: #ffffff;
            --text-main: #161823;
            --text-secondary: rgba(22, 24, 35, 0.75);
            --gray-btn: #efefef;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8f8f8; display: flex; justify-content: center; }

        .container { 
            width: 100%; max-width: 480px; min-height: 100vh; 
            background: var(--tiktok-bg); position: relative;
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .profile-header { text-align: center; padding: 30px 15px 15px; }
        .profile-pic {
            width: 105px; height: 105px; border-radius: 50%;
            object-fit: cover; border: 2px solid #fff; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer;
        }

        .name { font-size: 20px; font-weight: 700; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .handle { color: var(--text-main); font-size: 14px; margin-bottom: 20px; font-weight: 600; }

        .stats { display: flex; justify-content: center; gap: 25px; margin-bottom: 20px; }
        .stat-item { text-align: center; }
        .stat-val { font-weight: 700; font-size: 18px; display: block; }
        .stat-label { font-size: 13px; color: var(--text-secondary); }

        .btn-container { display: flex; justify-content: center; gap: 8px; padding: 0 20px; margin-bottom: 20px; }
        .btn { padding: 10px 0; border-radius: 4px; font-weight: 600; cursor: pointer; border: none; font-size: 15px; flex: 1; text-decoration: none; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        
        .btn-follow { background: var(--tiktok-red); color: white; }
        .btn-follow.active { background: var(--gray-btn); color: black; }
        .btn-message { background: var(--gray-btn); color: black; }
        .btn-more { background: var(--gray-btn); border: none; padding: 10px 14px; border-radius: 4px; cursor: pointer; }

        .tabs { display: flex; border-bottom: 1px solid #eee; position: sticky; top: 0; background: white; z-index: 10; }
        .tab-item { flex: 1; text-align: center; padding: 15px; cursor: pointer; color: #8a8a8e; font-size: 20px; }
        .tab-item.active { color: #000; border-bottom: 2px solid #000; }

        .content-section { display: none; }
        .content-section.active { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; }
        
        .video-item { position: relative; aspect-ratio: 3/4; background: #eee; overflow: hidden; cursor: pointer; }
        .video-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        .video-item:hover img { transform: scale(1.05); }
        
        /*   */
        .pinned-tag { position: absolute; top: 5px; left: 5px; background: var(--tiktok-red); color: white; font-size: 10px; padding: 2px 4px; font-weight: bold; border-radius: 2px; }
        .views { position: absolute; bottom: 8px; left: 8px; color: white; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 3px; }

        /*  */
        .modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .modal img { width: 80%; max-width: 350px; border-radius: 50%; border: 4px solid #fff; }
    </style>
</head>
<body>

<div class="container">
    <div class="profile-header">
        <img src="https://i.ibb.co.com/YTp6nDwC/image.jpg" class="profile-pic" id="profileImg">
        <div class="name">Sabbir Sadaf <i class="fa-solid fa-circle-check" style="color:#20d5ec; font-size: 16px;"></i></div>
        <div class="handle">@sabbir.sadaaf</div>

        <div class="stats">
            <div class="stat-item"><span class="stat-val">9</span><span class="stat-label">Following</span></div>
            <div class="stat-item"><span class="stat-val" id="followerCount">215.2K</span><span class="stat-label">Followers</span></div>
            <div class="stat-item" onclick="animateLikes()"><span class="stat-val" id="likeCount">482.6K</span><span class="stat-label">Likes</span></div>
        </div>

        <div class="btn-container">
            <button class="btn btn-follow" id="followBtn" onclick="toggleFollow()">Follow</button>
            <a href="https://wa.me/8801954422790" class="btn btn-message">Message</a>
            <button class="btn-more"><i class="fa-solid fa-caret-down"></i></button>
        </div>
        <div class="bio" style="font-size: 14px; padding: 0 30px;">Don't need any attitude caption... </div>
    </div>

    <div class="tabs">
        <div class="tab-item active" onclick="switchTab(event, 'videos')"><i class="fa-solid fa-grip-lines"></i></div>
        <div class="tab-item" onclick="switchTab(event, 'liked')"><i class="fa-regular fa-heart"></i></div>
    </div>

    <div id="videos" class="content-section active">
        <div class="video-item">
            <span class="pinned-tag">Pinned</span>
            <img src="https://i.ibb.co.com/bjJkPdWp/image.jpg">
            <div class="views"><i class="fa-solid fa-play"></i> 1.1M</div>
        </div>
        <div class="video-item"><img src="https://i.ibb.co.com/VcSgZPhb/image.jpg"><div class="views"><i class="fa-solid fa-play"></i> 25.4K</div></div>
        <div class="video-item"><img src="https://i.ibb.co.com/XxKKStRn/image.jpg"><div class="views"><i class="fa-solid fa-play"></i> 5.4K</div></div>
    </div>

    <div id="liked" class="content-section">
        <div class="video-item" style="filter: brightness(0.8);"><img src="https://i.ibb.co.com/VcSgZPhb/image.jpg"><div class="views"><i class="fa-solid fa-heart"></i> Liked</div></div>
    </div>
</div>

<div id="imageModal" class="modal" onclick="this.style.display='none'"><img src="https://i.ibb.co.com/YTp6nDwC/image.jpg"></div>

<script>
    //   
    document.getElementById('profileImg').onclick = () => document.getElementById('imageModal').style.display = 'flex';

    //      
    let isFollowing = false;
    function toggleFollow() {
        const btn = document.getElementById('followBtn');
        const countElement = document.getElementById('followerCount');
        
        if (!isFollowing) {
            btn.innerText = "Following";
            btn.classList.add('active');
            countElement.innerText = "215.3K"; //  
            isFollowing = true;
        } else {
            btn.innerText = "Follow";
            btn.classList.remove('active');
            countElement.innerText = "215.2K"; //  
            isFollowing = false;
        }
    }

    //  
    function animateLikes() {
        const count = document.getElementById('likeCount');
        count.style.transform = "scale(1.3)";
        count.style.color = "#fe2c55";
        setTimeout(() => { count.style.transform = "scale(1)"; count.style.color = "black"; }, 300);
    }

    //  
    function switchTab(event, tabId) {
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.content-section').forEach(c => c.classList.remove('active'));
        event.currentTarget.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }
</script>

</body>
</html>
